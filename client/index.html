<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Sizzle & Snap — Fast Food Pick Up</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #fcf9f8;
          color: #1c1b1b;
          font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
          transition: background-color 0.3s, color 0.3s;
        }
        /* Detect system dark mode to prevent white flash in dark mode */
        @media (prefers-color-scheme: dark) {
          .initial-loader {
            background-color: #0d0c0c;
            color: #f4f4f5;
          }
        }
        .loader-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(208, 0, 0, 0.1);
          border-left-color: #d00000;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 16px;
        }
        .loader-brand {
          font-size: 24px;
          font-weight: 800;
          letter-spacing: -0.02em;
          color: #d00000;
          margin-bottom: 8px;
        }
        .loader-text {
          font-size: 14px;
          font-weight: 500;
          opacity: 0.7;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-spinner"></div>
        <div class="loader-brand">SIZZLE & SNAP</div>
        <div class="loader-text">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
